services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://orderly:orderly@db:5432/orderly
      STRIPE_KEY: ${STRIPE_KEY}
      SMTP_URL: ${SMTP_URL}
      TZ: Europe/Amsterdam
    depends_on: [db]
  jobs:
    build: .
    command: npm run jobs
    environment:
      DATABASE_URL: postgres://orderly:orderly@db:5432/orderly
      SMTP_URL: ${SMTP_URL}
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orderly
      POSTGRES_PASSWORD: orderly
      POSTGRES_DB: orderly
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata: {}
