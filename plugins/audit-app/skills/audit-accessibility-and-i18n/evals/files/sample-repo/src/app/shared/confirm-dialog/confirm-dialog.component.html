<!-- Negative control: named dialog with a CDK focus trap and translated text -->
<div role="dialog" aria-modal="true" aria-labelledby="confirm-title" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
  <h2 id="confirm-title" i18n="@@confirmTitle">Confirm</h2>
  <p>{{ message | translate }}</p>
  <button type="button" (click)="ok()" i18n>OK</button>
  <button type="button" (click)="close()" [attr.aria-label]="'COMMON.CLOSE' | translate"><mat-icon aria-hidden="true">close</mat-icon></button>
</div>
