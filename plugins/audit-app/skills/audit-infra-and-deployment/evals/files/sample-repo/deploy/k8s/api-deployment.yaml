apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: inventory
  labels:
    app: inventory-api
spec:
  replicas: 2
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      containers:
        - name: api
          image: registry.example.com/inventory/api:latest
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Default
              value: "Server=sql;Database=inventory;User Id=sa;Password=P@ssw0rd123!"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: inventory
spec:
  selector:
    app: inventory-api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-api
  namespace: inventory
spec:
  rules:
    - host: api.inventory.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-api
                port:
                  number: 80
